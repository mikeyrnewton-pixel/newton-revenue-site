# Public-site safety/availability smoke check.
# Routine runs are read-only, without credentials, API writes or paid services.
# The explicit one-time synthetic probe below has fictional contact details and is push-message gated.
# A green routine run proves public routes and auth boundaries, NOT lead delivery.
name: Public website health monitor

on:
  push:
    branches: [main]
    paths: [".github/workflows/public-health.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public pages and private route protection
        shell: bash
        run: |
          set -euo pipefail
          base="https://newton-revenue-site.pages.dev"
          for path in "/" "/enquiry-check/" "/follow-up-tracker/" "/enquiry-diagnostic/"; do
            code=$(curl -sSL -o /tmp/newton-page.html -w "%{http_code}" \
              --retry 2 --retry-delay 2 --connect-timeout 10 --max-time 25 \
              "${base}${path}")
            echo "GET ${path} -> ${code}"
            if [[ "${code}" != "200" ]] || ! grep -Eqi '<html|<!doctype html' /tmp/newton-page.html; then
              echo "::error::Required public page unavailable or invalid: ${path}"
              exit 1
            fi
            if [[ "${path}" == "/" ]]; then
              if ! grep -Fq 'href="/enquiry-diagnostic/"' /tmp/newton-page.html ||
                 ! grep -Fq 'href="mailto:newtonrevenue@gmail.com' /tmp/newton-page.html; then
                echo "::error::Homepage paid diagnostic or human email contact route missing"
                exit 1
              fi
            fi
          done

          # No authentication: private lead route must reject or report missing secure config.
          leads_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 --max-time 20 "${base}/api/leads")
          echo "Unauthenticated GET /api/leads -> ${leads_code}"
          if [[ "${leads_code}" != "401" && "${leads_code}" != "503" ]]; then
            echo "::error::Unexpected private lead API status"
            exit 1
          fi

          # Non-writing invalid enquiry probes KV binding. The handler checks LEADS first:
          # 415 means KV available and invalid Content-Type was safely rejected;
          # 503 means storage is not available to the deployed function.
          # No personal information is sent and no KV records are created.
          intake_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 --max-time 20 -X POST \
            -H "Content-Type: text/plain" --data '' \
            "${base}/api/enquiry")
          echo "Invalid empty POST /api/enquiry (no data saved) -> ${intake_code}"
          if [[ "${intake_code}" != "415" ]]; then
            echo "::error::Lead intake storage may be unbound/unavailable; expected 415 for safe invalid content type"
            exit 1
          fi

          # No token or body: a public POST must never activate private retries.
          retry_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 --max-time 20 -X POST \
            "${base}/api/retry-owner-notices")
          echo "Unauthenticated POST /api/retry-owner-notices -> ${retry_code}"
          if [[ "${retry_code}" != "401" && "${retry_code}" != "503" ]]; then
            echo "::error::Owner retry endpoint did not reject unauthenticated access"
            exit 1
          fi
          echo "Public route + basic security smoke checks passed."

      - name: One-time synthetic lead-to-owner test
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run one synthetic lead notification acceptance probe'
        shell: bash
        run: |
          set -euo pipefail
          # Exactly one synthetic record, no real person or customer data.
          # Do not retry a network-ambiguous POST: avoid duplicate submissions.
          cat > /tmp/atlas-synthetic.json <<'JSON'
          {"name":"ATLAS SYNTHETIC TEST","company":"FICTIONAL TEST ONLY","email":"atlas-qa@example.invalid","problem":"SYNTHETIC ACCEPTANCE TEST ONLY - no real customer, buyer, transaction, marketing consent or payment. For validating Cloudflare KV to owner notification only.","contactPermission":true,"website":"","source":"enquiry-check","channel":"direct"}
          JSON
          response_code=$(curl -sS -o /tmp/atlas-synthetic-response.json -w "%{http_code}" \
            --connect-timeout 12 --max-time 35 \
            -H "Content-Type: application/json" \
            -H "Origin: https://newton-revenue-site.pages.dev" \
            --data-binary @/tmp/atlas-synthetic.json \
            "https://newton-revenue-site.pages.dev/api/enquiry")
          echo "SYNTHETIC ONLY POST /api/enquiry -> \${response_code}"
          if [[ "\${response_code}" != "201" ]]; then
            echo "::error::Synthetic enquiry intake failed; no real lead or owner-notice delivery is proved"
            exit 1
          fi
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/atlas-synthetic-response.json'))
          assert data.get('ok') is True and data.get('received') is True
          assert isinstance(data.get('reference'), str) and len(data['reference']) >= 32
          print('SYNTHETIC ONLY receipt validated; reference held privately in runner, not printed')
          PY
          echo "Reminder: 201 confirms KV intake, NOT successful email ACK or owner receipt."
